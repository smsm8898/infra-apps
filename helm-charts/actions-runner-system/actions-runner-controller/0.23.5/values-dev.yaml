environment: dev

actions-runner-controller:
  replicaCount: 2

  authSecret:
    name: actions-runner-controller-secret

  image:
    actionsRunnerRepositoryAndTag: # dev위치.dkr.ecr.ap-northeast-2.amazonaws.com/dev ECR

  serviceAccount:
    create: false
    name: actions-runner-controller-service-account

  resources:  
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector:
    node-group-name: # dev management nodegroup

  tolerations:
    - key: node-group-name
      operator: Equal
      value: # dev management nodegroup
      effect: NoSchedule

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-group-name
                operator: In
                values:
                  - # dev management nodegroup

  additionalVolumes:
    - name: actions-runner-controller-secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "actions-runner-controller-secrets-store"

  additionalVolumeMounts:
    - name: actions-runner-controller-secrets-store
      mountPath: /mnt/secrets-store
      readOnly: true
