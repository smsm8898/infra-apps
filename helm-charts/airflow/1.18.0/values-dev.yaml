environment: dev

airflow:
  # Airflow 3.x. 차트의 appVersion(3.0.2)보다 최신 패치를 쓰려면 명시 필요 —
  # 이 값이 컴포넌트 이미지 태그와 config 호환성 판단 기준이 된다.
  airflowVersion: '3.0.6'

  # 커스텀 이미지 (provider 패키지, DAG 의존 라이브러리 포함).
  # ⚠️ 이 값은 이미지 이름 문자열에 보간되므로 placeholder 를 null 로 두면
  #    `%!s(<nil>):latest` 로 렌더되어 YAML 자체가 깨진다 (annotation 처럼
  #    조용히 탈락하지 않음). 반드시 문자열 값을 둔다.
  defaultAirflowRepository: "dev위치.dkr.ecr.ap-northeast-2.amazonaws.com/airflow"  # ECR 위치
  defaultAirflowTag: "latest"

  images:
    airflow:
      pullPolicy: IfNotPresent
    # KubernetesExecutor 가 task 마다 띄우는 worker pod 은 항상 최신 이미지로
    pod_template:
      pullPolicy: Always
    # migration Job 도 커스텀 이미지 사용 (upstream 기본 이미지엔 provider 없음)
    useDefaultImageForMigration: false

  # Airflow 3.x 의 웹 UI/REST API 컴포넌트 (2.x 의 webserver 후속)
  apiServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # `webserver` 섹션은 3.x 에서도 남아 있고, create-user Job 이 이 값을 참조한다.
  # 기본 admin 계정 자동 생성을 끔 — 계정은 최초 1회 수동 생성하고 이후 관리는
  # 인증 백엔드(FabAuthManager)에 맡긴다. (sync 마다 Job 이 재실행되는 것도 방지)
  webserver:
    defaultUser:
      enabled: false

  # 차트가 Role/RoleBinding 을 만들도록 유지.
  # createSCCRoleBinding 은 OpenShift SecurityContextConstraints 용이라 EKS 에선 불필요.
  rbac:
    create: true
    createSCCRoleBinding: false

  ingress:
    # ⚠️ Airflow 3.x 는 `ingress.apiServer` 를 쓴다 (`ingress.web` 은 2.x webserver 용).
    #    최상위 `ingress.enabled` 는 deprecated.
    apiServer:
      enabled: true
      ingressClassName: "alb"
      annotations:
        alb.ingress.kubernetes.io/scheme: internal
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/ssl-certificate:    # certificate 위치
        alb.ingress.kubernetes.io/group.name:    # 공용 internal ALB group
        alb.ingress.kubernetes.io/load-balancer-attributes:    # access log 설정
      path: "/*"
      pathType: "ImplementationSpecific"
      hosts:
        - name: airflow.dev.example.com

  # 내장 postgresql(개발 편의용 StatefulSet) 대신 외부 관리형 DB(RDS) 사용.
  # 메타데이터 DB 는 DAG 상태·이력의 원본이라 pod 로컬 스토리지에 두지 않는다.
  postgresql:
    enabled: false

  data:
    # 외부 DB 접속 문자열을 담은 k8s Secret (key: connection).
    # CSI 가 Secrets Manager 에서 동기화 — templates/secrets-store.yaml 참고
    metadataSecretName: airflow-metadata-secret
    # KubernetesExecutor 는 celery broker 가 없지만, 이름을 주지 않으면 차트가
    # broker-url secret 을 자동 생성한다. 더미 이름으로 생성 자체를 회피.
    brokerUrlSecretName: "disabled"

  # 시크릿 3종을 차트 자동생성 대신 외부(Secrets Manager)에서 주입.
  # ⚠️ fernetKey 는 install 시점에만 설정 가능 — 나중에 바꾸면 기존 암호화된
  #    Connection/Variable 을 복호화할 수 없다.
  fernetKeySecretName: custom-fernet-key
  # Airflow 3.x: [api] secret_key (구 webserver secret_key 의 후속)
  apiSecretKeySecretName: custom-api-secret-key
  # Airflow 3.x: [api_auth] jwt_secret — 컴포넌트 간 인증 토큰 서명용.
  # (회사 구현은 CSI 로 시크릿은 만들지만 이 키로 연결하지 않아 차트 자동생성분이
  #  쓰이고 있었다 — 재배포 때마다 값이 바뀔 수 있는 지점)
  jwtSecretName: custom-jwt-secret

  # DB 마이그레이션은 ArgoCD sync 마다 돌지 않도록 끄고 수동/의도적으로 실행.
  # (sync 재시도와 만나면 중복 실행되고, Airflow 업그레이드 때만 필요)
  migrateDatabaseJob:
    enabled: false

  # KubernetesExecutor: task 마다 worker pod 을 띄우고 끝나면 정리.
  # → celery worker StatefulSet / redis broker / flower 가 전부 불필요해진다.
  executor: "KubernetesExecutor"

  # scheduler 가 task pod 을 생성/삭제할 수 있게 RBAC 부여 (KubernetesExecutor 필수)
  allowPodLaunching: true

  # CeleryExecutor 전용 broker — KubernetesExecutor 에선 불필요
  redis:
    enabled: false

  # 완료/실패 상태로 남은 task pod 정리 CronJob.
  # KubernetesExecutor 는 pod 을 계속 만들어내므로 dangling pod 청소가 필요.
  cleanup:
    enabled: true
    schedule: "*/15 * * * *"
    nodeSelector:
      node-group-name: dev-ng
    tolerations:
      - key: node-group-name
        operator: Equal
        value: dev-ng
        effect: NoSchedule

  # 컨트롤플레인 컴포넌트 공통 스케줄링 (scheduler/api-server/statsd 등).
  # 컴포넌트별 nodeSelector 가 있으면 그쪽이 우선.
  nodeSelector:
    node-group-name: dev-ng

  tolerations:
    - key: node-group-name
      operator: Equal
      value: dev-ng
      effect: NoSchedule

  # deferrable operator 의 async 대기를 담당. 기본 probe 는 너무 촘촘해서
  # 부팅/일시 부하 중 헛재시작을 유발 → 완화 (진짜 hang 만 잡도록)
  triggerer:
    nodeSelector:
      node-group-name: dev-ng
    tolerations:
      - key: node-group-name
        operator: Equal
        value: dev-ng
        effect: NoSchedule
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 30
      failureThreshold: 10
      periodSeconds: 60

  # Airflow 3.x 에서 DAG 파싱이 scheduler 와 분리된 독립 컴포넌트.
  # DAG 파일 수가 많으면 파싱 지연으로 probe 가 실패할 수 있어 동일하게 완화.
  dagProcessor:
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 30
      failureThreshold: 10
      periodSeconds: 60

  # task pod 을 다른 네임스페이스에도 띄울지. false 면 Role/RoleBinding(네임스페이스 한정),
  # true 면 ClusterRole/ClusterRoleBinding(클러스터 전체 권한)이 생성된다.
  multiNamespaceMode: false

  # KubernetesExecutor 의 task pod 스펙은 workers.* 를 읽어 만들어진다
  # (차트의 files/pod-template-file.kubernetes-helm-yaml → pod_template_file.yaml).
  # ⚠️ `podTemplateFile:` 은 upstream 에 없는 키다. 전체 pod 스펙을 직접 쓰려면
  #    문자열 키 `podTemplate:` 을 써야 하고, 보통은 workers.* 만으로 충분하다.
  workers:
    # task pod 은 컨트롤플레인과 분리된 worker nodegroup 에 배치
    # (task 가 노드를 점유해도 scheduler/api-server 가 영향받지 않게)
    nodeSelector:
      node-group-name: dev-worker-ng
    tolerations:
      - key: node-group-name
        operator: Equal
        value: dev-worker-ng
        effect: NoSchedule
    # task pod 기본 리소스. DAG 에서 executor_config 로 개별 override 가능.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    # 차트 자동생성 SA 대신 공용 SA(templates/service-account.yaml) 사용.
    # IRSA role 로 S3 로그 업로드 권한을 얻고, spark-rbac 의 RoleBinding 대상도 이 SA.
    serviceAccount:
      create: false
      name: airflow-service-account
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/dev-airflow-sa-role"
        eks.amazonaws.com/audience: "sts.amazonaws.com"

  # DAG 배포: git-sync 사이드카가 DAG 저장소를 주기적으로 pull.
  # 이미지에 DAG 를 굽지 않으므로 DAG 수정 시 재배포·이미지 빌드가 불필요하다.
  # (대안인 PVC 공유 방식은 RWX 스토리지가 필요하고 동기화를 직접 관리해야 함)
  dags:
    gitSync:
      enabled: true
      # SSH clone — deploy key 는 CSI 로 만든 airflow-ssh-secret (key: gitSshKey)
      repo: git@github.com:smsm8898/airflow-dags.git    # DAG 저장소
      # ⚠️ 차트가 쓰는 git-sync 는 v4 이고, v4 는 GITSYNC_REF(= ref 값)로 체크아웃한다.
      #    `branch` 는 v3 시절 변수(GIT_SYNC_BRANCH)로만 나가고 v4 컨테이너는 무시하므로,
      #    branch 만 설정하면 upstream 기본값 ref: v2-2-stable 이 그대로 적용돼
      #    존재하지 않는 브랜치를 계속 clone 시도하다 실패한다. 둘 다 맞춰 둔다.
      ref: main
      branch: main
      # repo 루트가 아니라 dags/ 하위만 동기화 (DAG 외 파일 제외)
      subPath: "dags"
      sshKeySecret: airflow-ssh-secret
      # 10초마다 pull. 실패가 3회 연속이면 컨테이너를 죽여 재시작
      # (0 = 무한 재시도 → 잘못된 자격증명/URL 을 조용히 방치하게 됨)
      period: 10s
      maxFailures: 3
      env:
        - name: GITSYNC_MAX_SYNC_FAILURES
          value: "3"
        # 대용량 저장소의 첫 clone 이 기본 타임아웃에 걸리지 않도록 여유
        - name: GITSYNC_SYNC_TIMEOUT
          value: "300s"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # CSI 볼륨을 모든 Airflow 컴포넌트에 마운트.
  # ⚠️ SecretProviderClass 의 secretObjects 동기화는 "pod 이 실제로 마운트할 때"
  #    발동한다 — 이 volumes/volumeMounts 가 없으면 k8s Secret 이 생성되지 않아
  #    위 metadataSecretName/fernetKeySecretName 참조가 전부 깨진다.
  volumes:
    - name: airflow-secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "airflow-secrets-store"

  volumeMounts:
    - name: airflow-secrets-store
      mountPath: "/mnt/secrets-store"
      readOnly: true

  # DAG 에서 쓸 외부 시스템 자격증명을 env 로 주입하는 패턴.
  # (회사 구현은 Snowflake/OpenSearch/Notion 등 다수 — 여기서는 Slack 만 예시)
  secret:
    - envName: SLACK_BOT_TOKEN
      secretName: slack-airflow-token
      secretKey: token

  # airflow.cfg 오버라이드 (env var 로 주입됨)
  config:
    logging:
      # task pod 은 끝나면 사라지므로 로그를 S3 로 내보내야 사후 조회가 가능하다.
      # (PVC 공유 방식 대신 — RWX 스토리지 불필요, 보존 기간을 S3 라이프사이클로 관리)
      remote_logging: 'True'
      remote_base_log_folder: s3://dev-airflow-logs/airflow    # S3 버킷 위치
      # AWS 자격증명은 IRSA 로 해결 (7단계 service-account) — conn 은 기본값 사용
      remote_log_conn_id: 'aws_default'
      colored_console_log: 'False'
    kubernetes_executor:
      # 성공한 task pod 은 즉시 정리
      delete_worker_pods: 'True'
      # 실패 pod 은 남긴다: 즉시 삭제하면 OOMKilled 상태가 kube-state-metrics
      # 스크랩 주기(30s) 안에 관측되지 않아 KubeContainerOOMKilled 알림이 유실된다.
      # (kube-prometheus-stack 6단계 룰과 연결된 설정) 정리는 cleanup CronJob 담당.
      delete_worker_pods_on_failure: 'False'
