# airflow base values
# 실제 설정은 values-dev.yaml / values-prod.yaml 에 upstream 기본값 대비 변경분만 적는다.
# upstream 기본값 전체는 charts/airflow-1.18.0.tgz 안의 values.yaml 참고 (3,085줄).
# (회사 구현체는 upstream 기본값 전체를 복사해뒀지만, kube-prometheus-stack 1단계에서
#  순수 중복임을 검증했으므로 여기서는 처음부터 최소 구성을 쓴다)

environment: ""

# Spark on Kubernetes 사용 여부 (templates/spark-rbac.yaml 게이트).
# Spark job 을 안 쓰는 환경에서는 false 로 두어 불필요한 권한을 만들지 않는다.
spark:
  enabled: true

# 메타데이터 DB 이력 보존 (templates/db-cleanup-cronjob.yaml).
# 기본은 off — 환경별로 명시적으로 켠다.
dbCleanup:
  enabled: false
  retentionDays: 90
  schedule: "0 18 * * 0"    # 일요일 03:10 KST 부근, 배치 한산한 시간대
  # ⚠️ dag_version / dag 는 의도적으로 제외 — CASCADE 로 최근 task_instance 가
  #    함께 삭제되는 함정이 있다. 상세는 templates/db-cleanup-cronjob.yaml 주석 참조.
  tables: "task_instance,task_instance_history,xcom,task_reschedule,dag_run,log,job,session"
  activeDeadlineSeconds: 5400
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# upstream airflow 차트에 전달되는 값의 루트 키.
# 키를 비워두면(null) 환경별 파일 merge 시 subtree 삭제 사고로 이어질 수 있어
# 자리표시자를 둔다 (upstream 이 사용하지 않는 관성 값).
airflow:
  enabled: true
