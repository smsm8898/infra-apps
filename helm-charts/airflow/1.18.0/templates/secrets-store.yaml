{{- /*
  Airflow 시크릿 부트스트랩 (AWS Secrets Manager → k8s Secret).

  동작 순서:
    1. parameters.objects  : Secrets Manager 의 어떤 secret 을 읽고, JSON 안에서
                             어떤 필드를(jmesPath) 어떤 별칭으로(objectAlias) 꺼낼지
    2. secretObjects       : 그 별칭들을 조합해 어떤 k8s Secret 을 만들지
    3. pod 이 CSI 볼륨을 마운트하는 순간 2번이 실행됨
       (values 의 airflow.volumes/volumeMounts 가 그 역할 — 없으면 Secret 이 안 생김)

  Secrets Manager 경로는 {{ .Values.environment }} 로 환경별 분기.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: airflow-secrets-store
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      # Airflow 코어 시크릿 (메타데이터 DB 접속 + 암호화/서명 키)
      - objectName: "{{ .Values.environment }}/airflow/secrets"
        objectType: secretsmanager
        jmesPath:
          - path: pg_conn
            objectAlias: airflow-metadata-secret
          - path: custom_fernet_key
            objectAlias: custom-fernet-key
          - path: api_secret_key
            objectAlias: custom-api-secret-key
          - path: jwt_secret
            objectAlias: custom-jwt-secret
      # DAG 저장소 접근용 GitHub deploy key (gitSync — 3단계)
      - objectName: "github/deploy-key/airflow-dags"
        objectType: secretsmanager
        jmesPath:
          - path: git_ssh_key
            objectAlias: git-ssh-key
      # DAG 에서 사용할 외부 시스템 자격증명 (예시: Slack 알림)
      - objectName: "{{ .Values.environment }}/slack/token"
        objectType: secretsmanager
        jmesPath:
          - path: bot_token
            objectAlias: slack-airflow-token

  secretObjects:
    # gitSync 는 gitSshKey 키를, 일부 경로는 sshKey 키를 참조하므로 둘 다 제공
    - secretName: airflow-ssh-secret
      type: Opaque
      data:
        - key: gitSshKey
          objectName: git-ssh-key
        - key: sshKey
          objectName: git-ssh-key
    # values 의 data.metadataSecretName 이 참조 (key 는 반드시 connection)
    - secretName: airflow-metadata-secret
      type: Opaque
      data:
        - key: connection
          objectName: airflow-metadata-secret
    - secretName: custom-fernet-key
      type: Opaque
      data:
        - key: fernet-key
          objectName: custom-fernet-key
    - secretName: custom-api-secret-key
      type: Opaque
      data:
        - key: api-secret-key
          objectName: custom-api-secret-key
    - secretName: custom-jwt-secret
      type: Opaque
      data:
        - key: jwt-secret
          objectName: custom-jwt-secret
    - secretName: slack-airflow-token
      type: Opaque
      data:
        - key: token
          objectName: slack-airflow-token
