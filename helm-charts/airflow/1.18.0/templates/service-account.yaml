{{- /*
  Airflow 공용 ServiceAccount (IRSA).

  차트가 컴포넌트별로 만드는 SA 대신 이걸 쓰는 이유:
    - task pod(worker)이 S3 로그 업로드 등 AWS API 를 호출해야 하고,
      그 권한을 IAM role 하나로 묶어 관리하기 위함
    - spark-rbac.yaml 의 RoleBinding 대상도 이 SA 하나로 통일

  values 의 airflow.workers.serviceAccount 에서 create: false + 이 이름을 지정해
  차트가 중복 생성하지 않도록 한다. annotations(role-arn)는 그쪽에서 주입.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-service-account
  namespace: {{ .Release.Namespace }}
  {{- with .Values.airflow.workers.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
