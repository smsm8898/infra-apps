{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    example.com/environment: {{ .Values.environment }}
# Pod Identity 사용 — annotation 없음. (namespace, SA name) ↔ IAM role 매핑은
# Terraform 의 PodIdentityAssociation 으로 별도 관리.
{{- end }}
