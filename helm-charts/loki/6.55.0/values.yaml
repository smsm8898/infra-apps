# Loki SingleBinary (monolithic) — 로그 집계 base values (환경 공통)
#
# upstream 기본값은 deploymentMode=SimpleScalable + storage.type=s3 라서 버킷명 없이는
# 렌더 자체가 실패한다(`Please define loki.storage.bucketNames.chunks`). 여기서
# SingleBinary + filesystem 으로 전환해 단일 파드(-target=all)로 모든 컴포넌트를 돌린다.
# 환경별 스토리지/보존/스케줄링은 values-<env>.yaml 에서 오버라이드.
#
# ⚠️ `loki:` 아래에 같은 이름 키가 두 계층으로 존재한다. 혼동 주의:
#    - `loki.loki.*`    = Loki 프로세스 설정(config.yaml 로 들어감)
#    - `loki.<컴포넌트>` = 차트가 만드는 워크로드(replicas 등)
#    compactor 가 대표적으로 양쪽에 다 있다.
loki:
  deploymentMode: SingleBinary

  # ── Loki 프로세스 설정 ────────────────────────────────────────────────
  loki:
    # 단일 테넌트. 멀티테넌시를 끄면 X-Scope-OrgID 없이 push/query 가능하고,
    # ruler 도 "fake" 테넌트 하나로 동작한다(3단계 /rules/fake 경로의 이유).
    auth_enabled: false

    commonConfig:
      # SingleBinary 1 파드라 복제 불가. 기본값 3 이면 ingester 링이 채워지지 않아 기동 실패.
      replication_factor: 1

    # 차트가 강제(fail)하는 필수 설정 — 클러스터마다 다르므로 기본값을 주지 않는다.
    # tsdb + v13 은 Loki 3.x 권장 조합.
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: filesystem

    limits_config:
      retention_period: 168h          # 7일 (prod 는 720h 로 상향)
      # 보존 기간보다 오래된 로그는 거부 — 이미 삭제된 구간에 재적재되는 것을 막는다.
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # /loki/api/v1/index/volume 활성화. Grafana 의 로그 볼륨 그래프가 이걸 쓴다.
      volume_enabled: true

    compactor:
      # retention 은 compactor 가 실제로 삭제를 수행할 때만 동작한다.
      # 이 스위치가 없으면 limits_config.retention_period 는 조회 필터로만 쓰이고
      # 디스크/오브젝트는 계속 쌓인다.
      retention_enabled: true
      delete_request_store: filesystem

    # 로그 패턴 자동 추출(Explore Logs 용). 부가 기능이고 메모리를 더 쓰므로 off.
    pattern_ingester:
      enabled: false

  # ── 워크로드: SingleBinary 만 사용 ────────────────────────────────────
  singleBinary:
    replicas: 1

  # 분산 모드 컴포넌트 13종 비활성. SingleBinary 모드에서도 차트는 이 값들을 읽어
  # 워크로드를 만들 수 있으므로 명시적으로 0 으로 눌러둔다.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0

  # ── 최소 footprint: 캐시/게이트웨이/카나리/테스트/minio 비활성 ────────
  # memcached 캐시 2종은 각각 StatefulSet 을 만든다. 단일 파드 규모에선 불필요.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  # 합성 로그를 넣고 되읽는 감시 DaemonSet. 클러스터 전 노드에 파드가 뜨므로 off.
  lokiCanary:
    enabled: false
  test:
    enabled: false
  # 개발용 내장 오브젝트 스토리지. dev 는 filesystem, prod 는 실제 S3 를 쓴다.
  minio:
    enabled: false
  # nginx 리버스 프록시. 클러스터 내부에서만 push/query 하므로 Service 직결로 충분.
  gateway:
    enabled: false
