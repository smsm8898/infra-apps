# Loki prod — base values.yaml 대비 변경분만.
#
# 스토리지 전략: S3(thanos objstore 클라이언트) + 작은 gp2 PVC.
# dev 와 달리 로그 유실을 허용하지 않으므로 청크/인덱스는 S3 에 두고,
# WAL 과 활성 인덱스만 PVC 로 노드 재시작을 견디게 한다.
#
# 자격증명은 values 에 두지 않는다. EKS Pod Identity 로 loki ServiceAccount 에
# prod-loki-sa-role 을 연결해 SDK 가 자동으로 집어가게 한다(클러스터 밖 설정).
# 개인 repo 의 airflow/reco-api 는 IRSA annotation 방식이라 여기와 다르다 — README 참고.
loki:
  loki:
    # dev 는 filesystem, prod 는 s3. schemaConfig 는 리스트라 부분 병합이 안 되므로
    # object_store 만 바꾸려 해도 블록 전체를 다시 쓴다.
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: s3
      bucketNames:
        chunks: prod-logs-loki    # S3 버킷 위치
        ruler: prod-logs-loki     # S3 버킷 위치
        admin: prod-logs-loki     # S3 버킷 위치
      # 레거시 S3 클라이언트 대신 thanos objstore 클라이언트를 쓴다.
      use_thanos_objstore: true
      object_store:
        type: s3
        # 한 버킷을 여러 용도로 나눠 쓰기 위한 키 프리픽스.
        storage_prefix: loki
        s3:
          # thanos s3 클라이언트는 endpoint 가 필수다 (region 만 주면 기동 실패).
          endpoint: s3.ap-northeast-2.amazonaws.com
          region: ap-northeast-2

    limits_config:
      retention_period: 720h          # 30일 (dev 는 168h)
      reject_old_samples: true
      reject_old_samples_max_age: 720h
      volume_enabled: true

    compactor:
      retention_enabled: true
      delete_request_store: s3

    # 로그 기반 알림 (dev 와 동일 구조 — 대상 Alertmanager 만 prod 것).
    rulerConfig:
      alertmanager_url: http://monitoring-alertmanager.monitoring.svc.cluster.local:9093
      enable_alertmanager_v2: true
      enable_api: true
      storage:
        type: local
        local:
          directory: /rules
      rule_path: /tmp/loki/rules-temp
      wal:
        dir: /var/loki/ruler-wal

    # ⚠️ use_thanos_objstore: true 는 최상위에 thanos 스타일 `ruler_storage: backend: s3`
    #    블록을 만들고, 이게 위 rulerConfig.storage(local)보다 우선한다. 그대로 두면
    #    ruler 가 빈 S3(prefix=loki)에서 룰을 찾아 알림이 하나도 발화하지 않는다.
    #    렌더에서 두 블록이 동시에 나오는 것을 확인했고, structuredConfig 로 ruler_storage
    #    만 local 로 되돌려 사이드카가 /rules/fake 에 떨군 룰을 읽게 한다.
    #    (청크/인덱스는 그대로 thanos S3 사용 — ruler_storage 만 override)
    structuredConfig:
      ruler_storage:
        backend: local
        local:
          directory: /rules

  singleBinary:
    replicas: 1

    # prod 는 WAL/활성 인덱스 durability 를 위해 작은 PVC 를 붙인다.
    # 청크는 S3 로 가므로 크게 필요 없다.
    persistence:
      enabled: true
      storageClass: gp2
      size: 10Gi

    # memory requests == limits — 로그 저장소가 메모리 압박으로 evict 되면
    # 그 구간 로그가 통째로 비므로, airflow prod 와 같은 패턴을 따른다.
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi

    nodeSelector:
      node-group-name: prod-ng
    tolerations:
      - key: node-group-name
        operator: Equal
        value: prod-ng
        effect: NoSchedule

  sidecar:
    rules:
      folder: /rules/fake

  # LogQL 알림 룰 (prod). dev 대비 임계값 상향 — 트래픽이 많아 dev 기준이면 상시 발화한다.
  # LogVolumeSpike 는 prod baseline 자체가 높아 제외. 전부 시작점이고 튜닝 대상.
  extraObjects:
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: loki-ruler-rules
        labels:
          loki_rule: ""
      data:
        log-alerts.yaml: |
          groups:
            - name: reco-api.logs
              rules:
                - alert: LogAppExceptionRaised
                  expr: 'sum by (namespace) (count_over_time({namespace="reco"} | json | message="request failed" [5m])) > 3'
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "[{{`{{ $labels.namespace }}`}}] 앱 예외 발생 — 최근 5m {{`{{ $value }}`}}건"
                    description: "uncaught exception (message=request failed). Loki 에서 해당 namespace 확인."
                - alert: LogHigh5xxRate
                  expr: 'sum by (namespace) (count_over_time({namespace="reco"} | json | http_response_status_code>=500 [5m])) > 20'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "[{{`{{ $labels.namespace }}`}}] 5xx 급증 — 최근 5m {{`{{ $value }}`}}건"
                    description: "http_response_status_code>=500 누적."
                - alert: LogErrorRateSpike
                  expr: 'sum by (namespace) (count_over_time({namespace="reco"} | json | level="error" [5m])) > 50'
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "[{{`{{ $labels.namespace }}`}}] 에러 로그 급증 — 최근 5m {{`{{ $value }}`}}건"
                    description: "level=error 누적 (logger.error 포함)."
            - name: airflow.logs
              rules:
                # dev 는 >0 이지만 prod 는 재시도로 자연 복구되는 단발 실패가 있어 상향.
                - alert: LogAirflowTaskFailed
                  expr: 'sum (count_over_time({namespace="airflow"} |= "Marking task as FAILED" [5m])) > 5'
                  for: 5m
                  labels:
                    severity: warning
                    namespace: airflow
                  annotations:
                    summary: "[airflow] task 실패 급증 — 최근 5m {{`{{ $value }}`}}건"
                    description: "Marking task as FAILED 누적. 특정 DAG 회귀 또는 외부 의존성 장애 의심."
                # DB 연결 오류는 단발이라도 심각 — dev 와 같은 임계값 유지.
                - alert: LogAirflowDbError
                  expr: 'sum (count_over_time({namespace="airflow"} |~ "(?i)(OperationalError|could not connect to server|too many connections)" [5m])) > 0'
                  for: 0m
                  labels:
                    severity: critical
                    namespace: airflow
                  annotations:
                    summary: "[airflow] 메타DB 연결 오류 — 최근 5m {{`{{ $value }}`}}건"
                    description: "scheduler/api-server 가 메타DB 에 붙지 못함. RDS 상태와 커넥션 수 확인."
                - alert: LogAirflowGitSyncFailed
                  expr: 'sum (count_over_time({namespace="airflow", container="git-sync"} |~ "(?i)error" [5m])) > 0'
                  for: 5m
                  labels:
                    severity: warning
                    namespace: airflow
                  annotations:
                    summary: "[airflow] git-sync 실패 지속 — 최근 5m {{`{{ $value }}`}}건"
                    description: "DAG 동기화가 멈추면 배포한 DAG 가 반영되지 않는다. deploy key 와 ref/branch 설정 확인."
