# Prod environment values for kube-prometheus-stack
# dev 와의 철학 차이:
#   - 스토리지: emptyDir → PVC (데이터/알림 상태 영속)
#   - defaultRules: dev 는 알림 전부 off + 수동 큐레이션, prod 는 upstream 큐레이션 on
#     + disabled 로 노이즈 알림만 개별 제거 + infra-extra 로 사각지대 보강
#   - Grafana 인증: admin 비밀번호 → Google OAuth (Secrets Manager + CSI)

environment: prod

kube-prometheus-stack:
  # Naming
  nameOverride: ""
  fullnameOverride: "monitoring"

  # Prometheus Operator
  prometheusOperator:
    enabled: true

    # prod 는 webhook 검증을 켜되, ArgoCD hook 과 충돌하는 patch Job 만 끔.
    # failurePolicy Ignore: 설치 시 검증 실패를 무시 (업그레이드 시엔 검증)
    admissionWebhooks:
      enabled: true
      failurePolicy: Ignore
      patch:
        enabled: false

    namespaces:
      releaseNamespace: true
      additional:
        - reco  # reco-api PodMonitor (RED 메트릭)

    podLabels:
      app: kube-prometheus-stack-operator
      release: kube-prometheus-stack

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    nodeSelector:
      node-group-name: prod-ng

    tolerations:
      - key: node-group-name
        operator: Equal
        value: prod-ng
        effect: NoSchedule

  # Prometheus Server
  prometheus:
    enabled: true

    prometheusSpec:
      replicas: 1

      # prod: 장기 보존 (retentionSize 는 PVC 크기보다 작게)
      retention: 30d
      retentionSize: 45GB

      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 3Gi

      # prod: PVC 영속 스토리지 (dev 의 emptyDir 와 대비)
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

      scrapeInterval: 30s
      scrapeTimeout: 10s
      evaluationInterval: 30s

      # ⚠️ dev 와 동일 — _helpers.tpl 의 upstream 헬퍼 덮어쓰기로 release 라벨이
      # 안 붙으므로 "전체 선택" 필수 (values-dev.yaml 의 상세 주석 참고)
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      externalLabels:
        cluster: prod
        environment: prod

      nodeSelector:
        node-group-name: prod-ng

      tolerations:
        - key: node-group-name
          operator: Equal
          value: prod-ng
          effect: NoSchedule

  # Grafana
  grafana:
    enabled: true

    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: browser

    # SQLite 백엔드라 multi-replica HA 가 의미 없음. RWO PVC 충돌 회피 위해 1로 운영.
    replicas: 1

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

    # prod: 수동 편집분(알림 무음, 사용자 설정)도 보존
    persistence:
      enabled: true
      type: pvc
      storageClassName: gp2
      size: 10Gi

    # OAuth 로그인 사용. admin 은 비상용 (배포 후 변경 필수)
    adminPassword: # 비상용 admin 비밀번호

    # OAuth 용 IRSA ServiceAccount — templates/grafana-serviceaccount.yaml 에서
    # environment=prod 일 때만 생성됨
    serviceAccount:
      create: false
      name: "monitoring-service-account"

    grafana.ini:
      dashboards:
        min_refresh_interval: 30s
      server:
        root_url: https://grafana.example.com
      # Google OAuth — client id/secret 은 AWS Secrets Manager 에서 CSI 로 주입
      # (아래 extraSecretMounts + envFromSecret 연결 고리 참고)
      auth.google:
        enabled: true
        client_id: ${GF_AUTH_GOOGLE_CLIENT_ID}
        client_secret: ${GF_AUTH_GOOGLE_CLIENT_SECRET}
        scopes: openid email profile
        auth_url: https://accounts.google.com/o/oauth2/v2/auth
        token_url: https://oauth2.googleapis.com/token
        api_url: https://openidconnect.googleapis.com/v1/userinfo
        allow_sign_up: true
        role_attribute_path: "'Admin'"

    # CSI 가 만든 k8s Secret(grafana-google-oauth)을 컨테이너 env 로 주입
    envFromSecret: grafana-google-oauth

    # SecretProviderClass 를 pod 에 마운트해야 CSI 가 Secret 을 동기화함
    # (templates/grafana-secretproviderclass.yaml, prod 전용)
    extraSecretMounts:
      - name: secrets-store-inline
        mountPath: /mnt/secrets-store
        readOnly: true
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: grafana-oauth-secrets-store

    sidecar:
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        provider:
          foldersFromFilesStructure: true

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /tmp/dashboards

    dashboards: {}

    # Ingress (internal ALB)
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internal
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/ssl-certificate:    # certificate 위치
        alb.ingress.kubernetes.io/group.name:    # 공용 internal ALB group
        alb.ingress.kubernetes.io/load-balancer-attributes:    # access log 설정
        alb.ingress.kubernetes.io/healthcheck-path: /api/health
      hosts:
        - grafana.example.com
      path: /*
      pathType: ImplementationSpecific
      tls: []

    nodeSelector:
      node-group-name: prod-ng

    tolerations:
      - key: node-group-name
        operator: Equal
        value: prod-ng
        effect: NoSchedule

  # Alertmanager
  alertmanager:
    enabled: true

    alertmanagerSpec:
      replicas: 1

      # Slack webhook — k8s secret (git 미포함, key: url). 생성 명령은 README 참고
      secrets:
        - alertmanager-slack-webhook

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

      # prod: 알림 상태(무음/그룹핑) 영속
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

      nodeSelector:
        node-group-name: prod-ng

      tolerations:
        - key: node-group-name
          operator: Equal
          value: prod-ng
          effect: NoSchedule

    # {{ }} 는 Alertmanager Go 템플릿 (values 는 Helm 템플릿 미처리)
    config:
      global:
        slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
        resolve_timeout: 5m
      route:
        receiver: slack-default
        group_by: ['alertname', 'namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # dead-man's switch 무음
          - receiver: 'null'
            matchers:
              - alertname = "Watchdog"
          # upstream 큐레이션 그룹의 info 심각도(CPUThrottlingHigh 등) 무음
          - receiver: 'null'
            matchers:
              - severity = "info"
      receivers:
        - name: 'null'
        - name: slack-default
          slack_configs:
            - send_resolved: true
              color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
              title: '[{{ .Status | toUpper }}:{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }} (prod)'
              title_link: 'https://grafana.example.com/alerting/list?search={{ .CommonLabels.alertname | urlquery }}'
              text: |-
                {{ range .Alerts }}• *{{ .Labels.severity }}* {{ if .Labels.namespace }}`{{ .Labels.namespace }}`{{ end }} — {{ .Annotations.summary }}
                {{ if .Annotations.description }}{{ .Annotations.description }}
                {{ end }}{{ if .Labels.pod }}    ↳ <https://grafana.example.com/d/6581e46e4e5c7ba40a07646395ef7b23/k8s-resources-pod?var-namespace={{ .Labels.namespace }}&var-pod={{ .Labels.pod }}&from=now-1h&to=now|Pod 리소스 대시보드>
                {{ end }}{{ if .Labels.node }}    ↳ <https://grafana.example.com/d/200ac8fdbfbb74b39aff88118e4d1c2c/k8s-resources-node?var-node={{ .Labels.node }}&from=now-1h&to=now|Node 리소스 대시보드>
                {{ end }}{{ end }}

  # kubelet/cAdvisor
  kubelet:
    enabled: true

  # coredns SM selector 오버라이드 — dev 와 동일 사유 (values-dev.yaml 주석 참고)
  coreDns:
    serviceMonitor:
      selector:
        matchLabels:
          app: kube-prometheus-stack-coredns
          jobLabel: coredns

  # EKS 관리형 컨트롤플레인 — 스크랩 타겟이 노출되지 않으므로 dead target 방지 위해 off
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true

  # node-exporter DaemonSet 은 모든 노드에서 떠야 함
  prometheus-node-exporter:
    tolerations:
      - operator: Exists

  kube-state-metrics:
    nodeSelector:
      node-group-name: prod-ng
    tolerations:
      - key: node-group-name
        operator: Equal
        value: prod-ng
        effect: NoSchedule

  # Default rules — prod 철학: upstream 큐레이션 알림을 켜고,
  # 노이즈 알림만 disabled 로 개별 제거. (dev 는 전부 off + 수동 큐레이션)
  defaultRules:
    create: true
    # 개별 알림 kill switch — 그룹은 켜되 특정 알림만 제거
    disabled:
      # per-node 타겟(kubelet/node-exporter)은 노드 scale-in 마다 10~15분 down 이
      # 정상 발생 → % 기반 upstream TargetDown 은 상시 false-fire.
      # 대체 룰: infra-extra 의 infra.general (per-node job 제외 + absent 가드)
      TargetDown: true
      # HPA max 도달 = 오토스케일러 정상 동작. 진짜 문제(포화)는 NearLimit 가 잡음
      KubeHpaMaxedOut: true
    rules:
      alertmanager: true
      etcd: false                       # EKS 관리형 — 타겟 없음
      configReloaders: true
      general: true
      k8s: true
      kubeApiserverAvailability: false  # SLO/burnrate 계열은 노이즈 — absent 가드로 대체
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false      # EKS 관리형
      kubelet: false
      kubeProxy: false                  # EKS 관리형
      kubePrometheusGeneral: true
      kubePrometheusNodeRecording: true
      kubernetesApps: true              # CrashLoop/NotReady/JobFailed 등 upstream 룰 사용
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: false           # kubelet-scrape 의존 알림 — false-fire 방지
      kubeSchedulerAlerting: false      # EKS 관리형
      kubeSchedulerRecording: false
      kubeStateMetrics: true
      network: true
      node: true
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: true
      prometheusOperator: true

  # upstream 큐레이션이 못 덮는 사각지대 보강 (dev 의 infra-alerts 전체와 대비 —
  # prod 는 upstream 알림이 켜져 있으므로 "보강(extra)"만 정의)
  additionalPrometheusRulesMap:
    # reco-api 앱 레벨 알림 — dev 와 동일 룰 미러 (dev/prod 파리티)
    reco-api-alerts:
      additionalLabels:
        release: kube-prometheus-stack
      groups:
        - name: reco-api.alerts
          rules:
            - alert: RecoHigh5xxErrorRate
              expr: |-
                (
                    sum by (namespace, job) (rate(http_requests_total{namespace="reco",status="5xx"}[5m]))
                  / sum by (namespace, job) (rate(http_requests_total{namespace="reco"}[5m]))
                ) > 0.05
                and
                  sum by (namespace, job) (rate(http_requests_total{namespace="reco",status="5xx"}[5m])) > 0.033
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "[reco] {{ $labels.job }} 5xx 에러율 {{ $value | humanizePercentage }} (5m)"
                description: "reco-api 5xx 비율이 5% 초과 & 5분 지속. 상류 서비스의 5xx 유발 여부와 앱 access 로그로 원인 확인."
            - alert: RecoHighLatencyP95
              expr: |-
                histogram_quantile(0.95,
                  sum by (namespace, job, le) (rate(http_request_duration_seconds_bucket{namespace="reco"}[5m]))
                ) > 0.5
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "[reco] {{ $labels.job }} p95 레이턴시 {{ $value | humanizeDuration }} (5m)"
                description: "p95 응답시간이 500ms 초과 & 10분 지속. DB/캐시 degrade, 상류 타임아웃, pod CPU 포화 확인."
    infra-extra:
      additionalLabels:
        release: kube-prometheus-stack
      groups:
        # upstream TargetDown 대체 (defaultRules.disabled 주석 참고).
        # per-node job 은 % 기반에서 제외하고 absent(전멸) 가드로 감시 —
        # selector 회귀 시 값 기반 알림이 조용히 죽는 사각지대 방지
        - name: infra.general
          rules:
            - alert: TargetDown
              expr: 100 * (count by (job, namespace, service) (up{job!~"kubelet|node-exporter"} == 0) / count by (job, namespace, service) (up{job!~"kubelet|node-exporter"})) > 10
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "One or more targets are unreachable."
                description: "{{ printf \"%.4g\" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} namespace are down."
            - alert: NodeExporterMetricsAbsent
              expr: absent(up{job="node-exporter"} == 1)
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "node-exporter 메트릭 소실 (prod)"
                description: "node-exporter 타겟이 30분 이상 전멸 — 노드 CPU/디스크 알림과 대시보드가 조용히 죽음."
            - alert: KubeletMetricsAbsent
              expr: absent(up{job="kubelet"} == 1)
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "kubelet/cadvisor 메트릭 소실 (prod)"
                description: "kubelet 타겟이 30분 이상 전멸 — 컨테이너 memory/CPU near-limit 알림이 조용히 죽음."
        - name: infra.node-extra
          rules:
            - alert: KubeNodeNotReady
              expr: kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true"} == 0
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Node NotReady: {{ $labels.node }}"
                description: "노드가 15분 이상 Ready 아님."
            # upstream NodeCPUHighUsage 는 severity=info 라 무음 라우팅됨 → warning 으로 별도 정의
            - alert: NodeCPUHighUtilization
              expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))) * 100 > 90
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Node CPU high: {{ $labels.instance }}"
                description: "노드 CPU 사용률이 30분 이상 90% 초과 (현재 {{ printf \"%.0f\" $value }}%)."
            # 노드 컨디션 3종 + cordon — kubelet eviction/GC 임박 신호
            - alert: KubeNodeMemoryPressure
              expr: kube_node_status_condition{job="kube-state-metrics",condition="MemoryPressure",status="true"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Node MemoryPressure: {{ $labels.node }}"
                description: "노드가 5분 이상 MemoryPressure 상태 — kubelet eviction 임박 가능."
            - alert: KubeNodeDiskPressure
              expr: kube_node_status_condition{job="kube-state-metrics",condition="DiskPressure",status="true"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Node DiskPressure: {{ $labels.node }}"
                description: "노드가 5분 이상 DiskPressure 상태 — 이미지/컨테이너 GC 와 pod eviction 임박."
            - alert: KubeNodePIDPressure
              expr: kube_node_status_condition{job="kube-state-metrics",condition="PIDPressure",status="true"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Node PIDPressure: {{ $labels.node }}"
                description: "노드 프로세스 수가 한계 근접 — 프로세스 누수 워크로드 확인 필요."
            - alert: KubeNodeCordonedTooLong
              expr: kube_node_spec_unschedulable{job="kube-state-metrics"} == 1
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Node cordoned 1h+: {{ $labels.node }}"
                description: "노드가 1시간 이상 cordon(SchedulingDisabled) 상태 — 정비 후 uncordon 누락 여부 확인."
        - name: infra.workload-extra
          rules:
            # OOM 사후 감지 — 상세 주석은 values-dev.yaml 참고 (dev/prod 동일 룰)
            - alert: KubeContainerOOMKilled
              expr: |-
                max by (namespace, pod, container) (max_over_time(kube_pod_container_status_terminated_reason{reason="OOMKilled",job="kube-state-metrics"}[15m])) == 1
                or
                (
                  max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled",job="kube-state-metrics"}) == 1
                  and
                  max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[15m])) > 0
                )
              labels:
                severity: warning
              annotations:
                summary: "OOMKilled: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
                description: "컨테이너가 메모리 초과로 종료됨 (메모리 limit 점검 필요)."
            - alert: ContainerMemoryNearLimit
              expr: |-
                max by (namespace, pod, container) (container_memory_working_set_bytes{job="kubelet", metrics_path="/metrics/cadvisor", container!="", image!=""})
                  / max by (namespace, pod, container) (kube_pod_container_resource_limits{job="kube-state-metrics", resource="memory"}) > 0.90
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Memory near limit: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
                description: "메모리 working set 이 15분 이상 limit 의 90% 초과 (현재 {{ $value | humanizePercentage }}) — OOMKill 위험."
            - alert: ContainerCPUNearLimit
              expr: |-
                sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", container!="", image!=""}[5m]))
                  / max by (namespace, pod, container) (kube_pod_container_resource_limits{job="kube-state-metrics", resource="cpu"}) > 0.95
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "CPU at limit: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
                description: "CPU 사용률이 30분 이상 limit 의 95% 초과 (현재 {{ $value | humanizePercentage }}) — throttling 으로 지연 발생 가능."
            # (CrashLoop/NotReady/JobFailed 는 upstream kubernetesApps 그룹이 담당)
        # 컨트롤플레인 접점 — absent() 는 "메트릭 소멸" 을 잡음 (값 기반 알림의 사각지대)
        - name: infra.control-plane
          rules:
            - alert: KubeAPIServerDown
              expr: absent(up{job="apiserver"} == 1)
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "kube-apiserver 메트릭 소실 (prod)"
                description: "apiserver 스크랩 타겟이 5분 이상 전멸 — 컨트롤플레인 통신/인증 문제 가능."
            - alert: CoreDNSDown
              expr: absent(up{job="coredns"} == 1)
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "CoreDNS 메트릭 소실 (prod)"
                description: "CoreDNS 타겟이 5분 이상 전멸 — 클러스터 DNS 장애 시 서비스 간 통신 연쇄 영향."
            - alert: CoreDNSHighErrorRate
              expr: sum(rate(coredns_dns_responses_total{job="coredns",rcode="SERVFAIL"}[5m])) / sum(rate(coredns_dns_responses_total{job="coredns"}[5m])) > 0.05
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "CoreDNS SERVFAIL 비율 5% 초과"
                description: "DNS 응답의 {{ $value | humanizePercentage }} 가 SERVFAIL — upstream DNS/CoreDNS 설정 확인."
