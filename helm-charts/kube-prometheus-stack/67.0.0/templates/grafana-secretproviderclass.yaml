{{- /*
  Grafana Google OAuth 시크릿 (prod 전용).
  AWS Secrets Manager 의 JSON secret 을 CSI 드라이버가 읽어
  k8s Secret(grafana-google-oauth) 으로 동기화한다.
  연결 고리: 이 SPC 를 grafana pod 가 extraSecretMounts 로 마운트해야
  secretObjects 동기화가 발동 → envFromSecret 으로 컨테이너 env 주입.
*/}}
{{- if eq .Values.environment "prod" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-oauth-secrets-store
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: "ap-northeast-2"
    objects: |
      - objectName: "prod/grafana/oauth"
        objectType: secretsmanager
        jmesPath:
          - path: client_id
            objectAlias: google-client-id
          - path: client_secret
            objectAlias: google-client-secret
  secretObjects:
    - secretName: grafana-google-oauth
      type: Opaque
      data:
        - key: GF_AUTH_GOOGLE_CLIENT_ID
          objectName: google-client-id
        - key: GF_AUTH_GOOGLE_CLIENT_SECRET
          objectName: google-client-secret
{{- end }}
