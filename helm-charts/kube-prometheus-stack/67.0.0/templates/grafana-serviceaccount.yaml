{{- /*
  Grafana OAuth 용 IRSA ServiceAccount (prod 전용).
  environment 값으로 게이트 — dev 렌더에서는 생성되지 않는다.
  values-prod.yaml 의 grafana.serviceAccount (create: false, name 참조) 와 짝.
*/}}
{{- if eq .Values.environment "prod" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-service-account
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: kube-prometheus-stack
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/prod-monitoring-sa-role"
    eks.amazonaws.com/audience: "sts.amazonaws.com"
    environment: "prod"
    purpose: "monitoring-oauth"
automountServiceAccountToken: true
{{- end }}
