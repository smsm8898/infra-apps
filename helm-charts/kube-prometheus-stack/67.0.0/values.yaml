# kube-prometheus-stack base values
# 실제 설정은 values-dev.yaml / values-prod.yaml 에 upstream 기본값 대비 변경분만 적는다.
# upstream 기본값 전체는 charts/kube-prometheus-stack-67.0.0.tgz 안의 values.yaml 참고.

environment: ""

# upstream kube-prometheus-stack 에 전달되는 값의 루트 키.
# enabled 는 upstream 이 사용하지 않는 관성 값이지만, 키를 비워두면(null)
# 환경별 파일 merge 시 subtree 삭제 사고로 이어질 수 있어 자리표시자로 둔다.
kube-prometheus-stack:
  enabled: true
