# Grafana Alloy — pod 로그 수집 DaemonSet → Loki (환경 공통)
#
# 수집 방식: loki.source.kubernetes 가 Kubernetes API 로 컨테이너 로그를 읽는다.
# 노드의 /var/log/pods 를 hostPath 로 붙이는 방식(promtail 관례)이 아니라서
# hostPath 마운트와 그에 딸린 권한 문제가 없다. 필요한 pods/log 권한은 차트
# 기본 ClusterRole 에 이미 포함되어 있다(렌더로 확인).
#
# 중복 방지: DaemonSet 이므로 모든 노드에 파드가 뜬다. 각 Alloy 가 discovery 단계에서
# spec.nodeName 으로 자기 노드 pod 만 고르게 해야 N중 수집이 안 생긴다.
alloy:
  alloy:
    configMap:
      content: |
        // 자기 노드의 pod 만 발견. K8S_NODE_NAME 은 차트가 모든 컨테이너에 무조건
        // 주입하는 환경변수(fieldRef: spec.nodeName)라 extraEnv 를 따로 둘 필요가 없다.
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
          }
        }

        // __meta_* 내부 라벨을 Loki 스트림 라벨로 승격.
        // 라벨은 스트림을 쪼개므로(카디널리티=비용) 조회에 실제로 쓰는 4개만 남긴다.
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.drop_health.receiver]
        }

        // /health 액세스 로그는 ELB·kube-probe 가 수초마다 찍어 양이 가장 많고 정보가 없다.
        // Loki 적재 전에 버려서 보존 용량과 쿼리 비용을 아낀다.
        loki.process "drop_health" {
          stage.drop {
            expression          = "\"http\\.route\": ?\"/health\""
            drop_counter_reason = "health_check"
          }
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            // Loki 차트의 SingleBinary Service. release 명이 차트명과 같아 fullname 이
            // loki 로 나오므로 이 주소가 성립한다 → app-of-apps 에서 releaseName 고정 필요.
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Alloy 의 storagePath(/tmp/alloy)에 WAL 과 로그 읽은 위치(positions)가 쌓인다.
    # 볼륨을 붙여두면 컨테이너가 재시작해도 같은 파드 안에서는 이어서 읽는다.
    # (파드가 다른 노드로 재스케줄되면 emptyDir 이라 초기화된다 — 그건 감수)
    mounts:
      extra:
        - name: alloy-storage
          mountPath: /tmp/alloy

  controller:
    type: daemonset
    # 전 노드 커버. 테인트가 걸린 노드(컨트롤플레인 전용 등)의 로그도 놓치지 않도록
    # node-exporter 와 같은 관례로 모든 테인트를 허용한다.
    tolerations:
      - operator: Exists
    volumes:
      extra:
        - name: alloy-storage
          emptyDir: {}
