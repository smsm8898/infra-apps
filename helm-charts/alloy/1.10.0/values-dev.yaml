# Alloy dev — 수집 설정은 base values.yaml 을 그대로 공유한다.
# Loki 주소가 dev/prod 동일(같은 namespace, 같은 Service 명)이라 환경 분기가 없다.
alloy:
  alloy:
    # clustering 은 여러 Alloy 가 수집 대상을 나눠 갖는 기능(StatefulSet/Deployment 용).
    # 여기선 DaemonSet 이 노드별로 이미 대상을 분할하므로 불필요. 기본값도 false 지만
    # "왜 안 쓰는지"를 남기기 위해 명시한다.
    clustering:
      enabled: false
