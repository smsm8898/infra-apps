environment: dev

# DO NOT EDIT THIS SECTION
argocd:
  project: default
  namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

applications:
  namespace: monitoring
  kubePrometheusStack:
    enabled: true
    version: "67.0.0"
